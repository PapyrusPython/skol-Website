<div class="dialogue"> 
    <img src="pictures_and_gifs/PapyrusTalk.png" alt="papyrus talking" height="100px" width="75">
    <p class="test" id="dialogue-text"></p>



</div>

<!--JS script straight from ChatGpt-->
<script>
  const message = "* Im the Roaring Knight !!";
  const textElement = document.getElementById("dialogue-text");
  let letter = 0;

  function typeNextLetter() {
    if (letter < message.length) {
      textElement.textContent += message[letter];
      letter++;
      setTimeout(typeNextLetter, 50);
    } else {
      setTimeout(restartMessage, 1500); // pause when finished
    }
  }

  function restartMessage() {
    textElement.textContent = "";
    letter = 0;
    typeNextLetter();
  }

  typeNextLetter();
</script>
