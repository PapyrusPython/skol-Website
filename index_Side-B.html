<!-- speed slider for video -->
<h3 class="center">speed slider</h3 >
<input class="center" type="range" id="speedslider" min="0.1" max="10" step="0.1" value="1">
<script>
  const video = document.querySelector('.dance-video');
  const speedSlider = document.getElementById('speedslider');

  speedSlider.addEventListener('input', () => {
    video.playbackRate = speedSlider.value;
  });
</script>


<br>
<br>
<!--Moving text-->
<div class="lower">
    <h2 class="animation">I'm bouncing on a trampoline!</h2>
</div>

<!--papyrus dialogue-->
<div class="dialogue"> 
    <img src="pictures_and_gifs/PapyrusTalk.png" alt="papyrus talking" height="100px" width="75">
    <p class="test" id="dialogue-text"></p>



</div>

<!--JS script straight from ChatGpt-->
<script>
  const message = "* well hi there!";
  const textElement = document.getElementById("dialogue-text");
  let letter = 0;

  function typeNextLetter() {
    if (letter < message.length) {
      textElement.textContent += message[letter];
      letter++;
      setTimeout(typeNextLetter, 50);
    } else {
      setTimeout(restartMessage, 1500); // pause when finished
    }
  }

  function restartMessage() {
    textElement.textContent = "";
    letter = 0;
    typeNextLetter();
  }

  typeNextLetter();
</script>
